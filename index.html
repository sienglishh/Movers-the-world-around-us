<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards Từ Vựng Tiếng Anh - The World Around Us</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      color: #ffffff;
      margin-bottom: 20px;
      font-size: 2rem;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .card {
      width: 340px;
      height: 420px;
      background: #ffffff;
      border-radius: 25px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
      border: 5px solid #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
    }

    .icon {
      font-size: 5rem;
      margin-top: 10px;
    }

    .text-container {
      text-align: center;
    }

    .word {
      font-size: 2.1rem;
      font-weight: bold;
      color: #11998e;
      margin-bottom: 8px;
    }

    .meaning {
      font-size: 1.5rem;
      font-weight: bold;
      color: #e67e22;
    }

    .btn-audio {
      background: #11998e;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(17, 153, 142, 0.3);
      transition: transform 0.1s, background 0.2s;
    }

    .btn-audio:hover {
      background: #0e8278;
      transform: scale(1.05);
    }

    .controls {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .btn-nav {
      background: #e67e22;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-nav:hover {
      background: #d35400;
      transform: scale(1.05);
    }

    .progress {
      font-size: 1.2rem;
      font-weight: bold;
      color: #2d3436;
      background: rgba(255,255,255,0.85);
      padding: 8px 16px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <h1>🌍 The World Around Us 🌿</h1>

  <div class="card">
    <div class="icon" id="icon">🏢</div>
    
    <div class="text-container">
      <div class="word" id="word">building</div>
      <div class="meaning" id="meaning">tòa nhà</div>
    </div>

    <button class="btn-audio" onclick="speakCurrentWord()">🔊 Nghe đọc</button>
  </div>

  <div class="controls">
    <button class="btn-nav" onclick="prevCard()">◄ Trước</button>
    <div class="progress" id="progress">1 / 24</div>
    <button class="btn-nav" onclick="nextCard()">Sau ►</button>
  </div>

  <script>
    const vocabulary = [
      { word: "building", meaning: "tòa nhà", icon: "🏢" },
      { word: "city", meaning: "thành phố", icon: "🏙️" },
      { word: "country", meaning: "đất nước / quốc gia", icon: "🗺️" },
      { word: "countryside", meaning: "vùng nông thôn", icon: "🏡" },
      { word: "field", meaning: "cánh đồng", icon: "🌾" },
      { word: "forest", meaning: "khu rừng", icon: "🌲" },
      { word: "grass", meaning: "bãi cỏ", icon: "🌱" },
      { word: "ground", meaning: "mặt đất", icon: "🪴" },
      { word: "island", meaning: "hòn đảo", icon: "🏝️" },
      { word: "lake", meaning: "hồ nước", icon: "🏞️" },
      { word: "leaf / leaves", meaning: "lá cây", icon: "🍃" },
      { word: "moon", meaning: "mặt trăng", icon: "🌙" },
      { word: "mountain", meaning: "ngọn núi", icon: "⛰️" },
      { word: "plant", meaning: "cây cối / thực vật", icon: "🪴" },
      { word: "river", meaning: "dòng sông", icon: "🌊" },
      { word: "road", meaning: "con đường", icon: "🛣️" },
      { word: "rock", meaning: "hòn đá", icon: "🪨" },
      { word: "sky", meaning: "bầu trời", icon: "☁️" },
      { word: "star", meaning: "ngôi sao", icon: "⭐" },
      { word: "town", meaning: "thị trấn", icon: "🏘️" },
      { word: "village", meaning: "làng quê", icon: "🏕️" },
      { word: "waterfall", meaning: "thác nước", icon: "🌊" },
      { word: "wave", meaning: "sóng biển", icon: "🌊" },
      { word: "world", meaning: "thế giới", icon: "🌍" }
    ];

    let currentIndex = 0;
    const wordElement = document.getElementById('word');
    const meaningElement = document.getElementById('meaning');
    const iconElement = document.getElementById('icon');
    const progressElement = document.getElementById('progress');

    function updateCard() {
      const item = vocabulary[currentIndex];
      wordElement.textContent = item.word;
      meaningElement.textContent = item.meaning;
      iconElement.textContent = item.icon;
      progressElement.textContent = `${currentIndex + 1} / ${vocabulary.length}`;
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }

    function nextCard() {
      if (currentIndex < vocabulary.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function speakCurrentWord() {
      const textToSpeak = vocabulary[currentIndex].word.replace(/\/.*/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    updateCard();
  </script>
</body>
</html>
